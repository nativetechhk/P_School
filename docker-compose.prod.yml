# 伺服器生產用（§8 / §11）：含 Caddy 自動 TLS，前置 Cloudflare
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_class
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redisdata:/data"]

  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    command: sh -c "node_modules/.bin/prisma migrate deploy && node server.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_class
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data/uploads
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      COOKIE_SECURE: "true"
      CHROME_PATH: /usr/bin/chromium
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    command: node dist/worker.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_class
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /data/uploads
      SESSION_SECRET: ${SESSION_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      CHROME_PATH: /usr/bin/chromium
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
